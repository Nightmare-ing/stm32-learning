name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ==========================================================================
  # Job 1: PC Host Unit Test
  # ==========================================================================
  host-unit-tests:
    name: Run Host Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gcc g++

      - name: Configure host tests
        run: cmake --preset host-test

      - name: Build unit tests
        run: cmake --build --preset host-test

      - name: Execute CTest suite
        run: ctest --preset host-test --output-on-failure
